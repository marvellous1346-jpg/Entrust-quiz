<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrust Quiz</title>
<style>
:root{--bg:#23072f;--bg2:#3a0f4d;--panel:#4a1560;--line:#7a3a92;--fg:#fff;--mute:#d9ccff;--accent:#ffd96b;--bad:#ff8a96;--ok:#52dba0;--ink:#2a0b3d;
--font:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
.app{max-width:720px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logos{display:flex;align-items:center;gap:12px}.logos img{height:44px;width:auto}.logos img.en{height:32px}.logos i{width:1px;height:36px;background:var(--line)}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{background:transparent;color:var(--mute);border:0;padding:6px 12px;font:700 13px var(--font);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--mute);color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scr{display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:clamp(34px,9vw,60px);line-height:1.04;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.2;font-weight:800;text-wrap:balance}
.sub{margin:0;color:var(--mute);font-size:18px;max-width:52ch}
.ico{font-size:64px;line-height:1}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--mute)}
.rules li{padding-left:18px;position:relative}.rules li::before{content:"";position:absolute;left:0;top:.65em;width:8px;height:2px;background:var(--accent)}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:4px;padding:14px 24px;font:800 18px var(--font);cursor:pointer;align-self:flex-start}
.btn:hover{filter:brightness(1.06)}
.bar{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;width:100%;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:14px 16px;font:600 17px var(--font);cursor:pointer}
.opt:not(:disabled):hover{background:var(--fg);color:var(--ink)}
.opt:disabled{cursor:default;opacity:.55}
.opt.ok{opacity:1;background:var(--ok);border-color:var(--ok);color:var(--ink)}
.opt.bad{opacity:1;background:var(--bad);border-color:var(--bad);color:var(--ink)}
.pct{font-size:clamp(56px,16vw,104px);font-weight:900;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.pzcard{background:var(--panel);border:2px dashed var(--accent);border-radius:14px;padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}
.pzl{color:var(--mute);font-size:14px}
.pzcode{font-size:clamp(30px,9vw,54px);font-weight:900;letter-spacing:.08em;color:var(--accent);font-variant-numeric:tabular-nums}
.pzt{color:var(--mute);font-variant-numeric:tabular-nums}
.foot{margin-top:auto;display:grid;gap:6px}.slogan{margin:0;font-weight:700}.note{margin:0;font-size:12px;color:var(--mute)}
.mrow{display:flex;align-items:center;gap:14px}
.mas{flex:none;width:84px;height:102px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}.mas.big{width:120px;height:145px}
.mas svg{display:block;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,150,255,.45))}
.mas .f{display:none}
.mas[data-m=idle] .f-idle,.mas[data-m=happy] .f-happy,.mas[data-m=oops] .f-oops,.mas[data-m=wow] .f-wow,.mas[data-m=giggle] .f-giggle,.mas[data-m=meh] .f-meh{display:inline}
.mas[data-m=happy] svg{animation:jmp .5s ease-out 2}.mas[data-m=happy] .sh{animation:lk 1.2s ease-in-out}
.mas[data-m=wow] svg{animation:jmp .4s ease-out}.mas[data-m=giggle] svg{animation:shk .35s ease-in-out 3}.mas[data-m=oops] svg{animation:shk .4s}
.mas:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
.bub{position:relative;background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;max-width:34ch;min-height:1.4em}
.bub::before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-left:0;border-right-color:#fff}
@keyframes flt{50%{transform:translateY(-5px)}}@keyframes jmp{40%{transform:translateY(-16px)}}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes lk{0%,55%,100%{transform:translateY(0)}15%,40%{transform:translateY(-22px)}}
#sStart{flex:1;justify-content:center;align-items:center;text-align:center;gap:22px}
#sStart .mrow{flex-direction:column;gap:18px}
#sStart .bub{text-align:center}
#sStart .bub::before{left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
#sStart .btn{align-self:center;font-size:22px;padding:16px 44px}
.top{flex-wrap:wrap}.home{margin-left:auto;background:transparent;color:var(--fg);border:2px solid var(--mute);border-radius:4px;padding:6px 12px;font:700 13px var(--font);cursor:pointer}
#left{font-weight:800;color:var(--accent);font-size:22px}.pzcard.dead #left{color:var(--bad)}.pzcard.dead .pzcode{text-decoration:line-through;opacity:.35}
.about{width:100%;max-width:600px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.about h3{margin:0;font-size:20px;font-weight:800}.about p{margin:0;color:var(--mute)}
.about ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.about li{display:flex;gap:14px;align-items:center}
.iso{width:64px;height:64px;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}.iso.big{width:104px;height:104px;animation:flt 3s ease-in-out infinite}
.iso .s{stroke:rgba(35,7,47,.45);stroke-width:.7;stroke-linejoin:round}
#sSulk{flex:1;justify-content:center;align-items:center;text-align:center;gap:22px}
#sSulk .mrow{flex-direction:column;gap:18px}#sSulk .bub{text-align:center}
#sSulk .bub::before{left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.mas[data-m=wait] .f-wait,.mas[data-m=annoyed] .f-annoyed,.mas[data-m=angry] .f-angry,.mas[data-m=furious] .f-furious,.mas[data-m=resign] .f-resign{display:inline}
.mas[data-m=angry] svg{animation:shk .5s ease-in-out infinite}.mas[data-m=furious] svg{animation:shk .22s linear infinite}
html,body{overflow-x:hidden}
.mas.leave{position:relative;z-index:5;animation:away 1.1s ease-in forwards}.mas.enter{animation:comeback .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes away{0%{transform:none}15%{transform:translateX(-10px) rotate(-8deg)}100%{transform:translate(130vw,-30px) rotate(28deg)}}
@keyframes comeback{from{transform:translateX(-130vw) rotate(-24deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.mas.leave,.mas.enter{animation:none}}
@media (prefers-reduced-motion:reduce){.iso,.eye{animation:none!important}}
.about b{display:block}.about span{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.mas svg,.sh{animation:none!important}}
</style></head><body>

function mood(m,ms){var k=++mt;document.querySelectorAll('.mas').forEach(function(e){e.dataset.m=m});if(ms)setTimeout(function(){if(mt===k)mood('idle')},ms)}
document.querySelectorAll('.mas').forEach(function(e){e.innerHTML=MASCOT;e.setAttribute('role','button');e.setAttribute('aria-label','Lockie');e.tabIndex=0;
 e.onclick=function(){poke(e)};e.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();poke(e)}}});
function t(k){return T[lang][k]}
function shuffle(a){for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),x=a[j];a[j]=a[r];a[r]=x}return a}
function show(id){['sStart','sSulk','sQ','sEnd'].forEach(function(x){$(x).hidden=x!==id});clearInterval(iv);$('home').hidden=id==='sStart'||id==='sSulk';window.scrollTo(0,0)}
function render(){
 var q=Q[i],bl=ans===0?t('ok'):t('bad');$('bQ').textContent=ans<0?t('pick'):bl[ph%bl.length];$('cnt').textContent=t('q')+' '+(i+1)+' / '+Q.length;$('prog').style.width=(i/Q.length*100)+'%';
 $('qt').textContent=q.q[L[lang]];var w=$('opts');w.textContent='';
 ord[i].forEach(function(k){var b=document.createElement('button');b.type='button';
  b.className='opt'+(ans>=0?(k===0?' ok':k===ans?' bad':''):'');b.disabled=ans>=0;
  b.textContent=q.o[k][L[lang]];b.onclick=function(){ans=k;ph=Math.floor(Math.random()*12);if(k===0)score++;mood(k===0?(ph%2?'wow':'happy'):'oops',2000);save();render()};w.appendChild(b)});
 $('nx').hidden=ans<0;$('nx').textContent=i<Q.length-1?t('next'):t('finish');
}
function endRender(){
 var win=score>=PRIZE_MIN;
 $('bE').textContent=win?t('bw'):t('bl');$('esc').textContent=score+' / '+Q.length;
 $('emsg').textContent=score===Q.length?t('perfect'):win?t('good'):t('retry');
 $('pz').hidden=!win;$('code').textContent=code;$('cta').textContent=win?t('ctaW'):t('ctaL');
}
function end(){
 var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';code='ENT-'+score;
 for(var j=0;j<4;j++)code+=(j?'':'-')+a.charAt(Math.floor(Math.random()*a.length));
 done=true;at=Date.now();save();showEnd();
}
function showEnd(){
 show('sEnd');endRender();mood(score===Q.length?'giggle':score>=PRIZE_MIN?'happy':'meh');
 var tick=function(){var n=Date.now(),l=at+3600000-n;$('time').textContent=new Date(n).toLocaleString();
  if(score>=PRIZE_MIN){$('left').textContent=l>0?t('left')+' '+('0'+Math.floor(l/60000)).slice(-2)+':'+('0'+Math.floor(l/1000)%60).slice(-2):t('exp');$('pz').classList.toggle('dead',l<=0)}};tick();iv=setInterval(tick,1000);
}
function apply(){
 document.documentElement.lang=lang;document.title=t('title');
 document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.getAttribute('data-i'))});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang)});
 
 if(!$('sQ').hidden)render();if(!$('sEnd').hidden)endRender();updGo();
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.getAttribute('data-lang');apply()}});
$('go').onclick=function(){
 if(sel.length){if(done)showEnd();else{show('sQ');render()}return}
 sel=shuffle(BANK.map(function(q,k){return k})).slice(0,10);Q=sel.map(function(k){return BANK[k]});
 i=0;score=0;ans=-1;code='';done=false;ord=Q.map(function(){return shuffle([0,1,2])});save();mood('idle');show('sQ');render()};
$('nx').onclick=function(){i++;ans=-1;mood('idle');if(i>=Q.length)end();else{save();render()}};
apply();
var sv=null,lt=0,ltm;
try{sv=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(sv&&sv.sel&&sv.sel.every(function(k){return BANK[k]})){sel=sv.sel;Q=sel.map(function(k){return BANK[k]});ord=sv.ord;i=sv.i;score=sv.score;ans=sv.ans;ph=sv.ph||0;code=sv.code;done=!!sv.done;at=sv.at||Date.now();if(!sv.at)save();
 if(done)showEnd();else{show('sQ');render()}}

try{sulkUntil=+localStorage.getItem(SKEY)||0}catch(e){}
if(sulkUntil>Date.now())showSulk();
